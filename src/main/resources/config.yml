# SiegeBot の設定。変更したら /siegebot reload で読み直せます。
# リスポーン地点と /sb spawn で出したボットは、ゲーム内コマンドで設定し、data.yml に保存されます。

# 攻め・守りに対応するスコアボードのチーム名（/team で作ったチームの名前）
teams:
  attack: "Attack"
  defend: "Defence"

# ボットは自動では出ない・復活しない。コマンドブロックの /sb revive <@p|@a|プレイヤー|bots|all> で出し、蘇生する。
# 出す場所は陣営のリスポーン地点（/sb spawnpoint）、未設定なら持ち主の横。持ち主が倒れるとボットも倒れる。
personal-bots:
  # true: チームに入っているプレイヤーに、専用のボット（「名前の兵」）を出す。1 人が複数体持てる。
  #       抜けると消える。指示（指揮メニュー・/sbc）は自分のボットにだけ効く。
  #       /sb spawn で出したボットは持ち主がいないので、誰の指示も受けず、出した地点を守る。
  # false: 専用のボットは出さず、チームのボットにチームの誰でも指示できる。
  enabled: true
  # 1 人が持てるボットの上限（1〜9）。何体出すかはコマンドブロックの /sb revive <対象> <数> で決める
  max-per-player: 5

orders:
  # 「視点の先を守れ」で狙える最大の距離（ブロック）
  hold-max-distance: 48
  # 「呼び寄せる」（自分の所へ瞬間移動）を続けて使えない秒数。0 なら何度でも使える
  call-cooldown-seconds: 0
  # true: CombatLog プラグインで戦闘中（プレイヤーを殴った・殴られた後の combat-time 秒）のあいだは「呼び寄せる」を使えない。
  #       CombatLog が入っていなければ何もしない
  call-blocked-in-combat: true

combat:
  # 敵に気づく距離（ブロック）
  engage-radius: 16
  # 積極的に戦うとき、持ち場からどこまで敵を追うか
  push-leash: 24
  # 持ち場優先のとき、持ち場からどこまで敵を追うか
  guard-leash: 8
  # 追従のとき、相手にどこまで近づくか
  follow-distance: 4
  # 守る地点に着いたとみなす距離
  arrive-radius: 3
  # 経路を探す最大の距離（ブロック）。持ち場がこれより離れていると歩いていけません
  path-range: 96
  # 飛び降りてよい高さ（ブロック）。既定の 384 はワールドの高さ全部なので、どれだけ高い所からでも飛び降りる
  max-fall-distance: 384
  # false にするとボットは落下のダメージを受けない（true ならプレイヤーと同じく、高すぎると落ちて倒れる）
  fall-damage: true
  # 自動の回復: regen-interval-seconds 秒ごとに regen-amount ずつ体力が戻る（体力は最大 20 = ハート 10 個）。
  # 既定は 2 秒ごとに 1（ハート半分）で、空の体力から満タンまで約 40 秒。regen-amount: 0 で回復しない
  regen-amount: 1.0
  regen-interval-seconds: 2
  # ダメージ（攻撃・落下・炎など）を受けてから、この秒数は回復しない。0 なら受けている最中も回復する
  regen-delay-seconds: 10
  # 移動の速さの倍率。平らな地面で測った値: 1.0 で毎秒約 3.9 ブロック（歩きより少し遅い）、
  # 1.5 で毎秒約 5.6 ブロック（プレイヤーのダッシュと同じくらい）、
  # 1.95 で毎秒約 7.2 ブロック（プレイヤーのダッシュジャンプと同じくらい）
  # （上の値は経路探索が CITIZENS のときのもの。MINECRAFT では 1.5 で毎秒約 5.4 ブロック）
  speed: 1.5
  # 火力: ボットが与えるダメージの倍率（1.0 でそのまま）
  damage-multiplier: 1.2
  # 防御力: ボットが受けるダメージをこの値で割る（1.0 でそのまま。1.2 なら受けるダメージが約 83%）
  # ボットどうしの戦いでは両方が効くので、火力と防御力が同じ値なら、ダメージは 1.0 のときと同じになる
  defense-multiplier: 1.2
  # 狙いを選び直す間隔（秒）。この間隔ごとに最も近い敵を探し、今の相手より 2 ブロック以上近い敵がいれば狙いを替える。
  # 今の相手が倒れた・見えなくなった・範囲を出たときは、間隔を待たずにすぐ選び直す。
  retarget-seconds: 2
  attack-range: 3.0
  # 攻撃の間隔（tick。20 で 1 秒）
  attack-delay-ticks: 12
  # 経路探索の方式: MINECRAFT / CITIZENS / CITIZENS_ASYNC
  # MINECRAFT 以外では、高い所から飛び降りる経路を見つけられない（試験サーバーで確かめた結果）
  pathfinder: "MINECRAFT"

# ボットの装備（アイテムの ID）。不要な部位は行ごと消してください
equipment:
  hand: IRON_SWORD
  helmet: IRON_HELMET
  chestplate: IRON_CHESTPLATE
  leggings: IRON_LEGGINGS
  boots: IRON_BOOTS
