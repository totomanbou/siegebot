# SiegeBot の設定。変更したら /siegebot reload で読み直せます。
# リスポーン地点と /sb spawn で出したボットは、ゲーム内コマンドで設定し、data.yml に保存されます。

# 攻め・守りに対応するスコアボードのチーム名（/team で作ったチームの名前）
teams:
  attack: "attack"
  defend: "defend"

personal-bots:
  # true: チームに入っているプレイヤー 1 人に 1 体、専用のボット（「名前の兵」）を出す。
  #       参加すると出て、抜けると消える。指示（指揮メニュー・/sbc）は自分のボットにだけ効く。
  #       /sb spawn で出したボットは持ち主がいないので、誰の指示も受けず、出した地点を守る。
  # false: 専用のボットは出さず、チームのボットにチームの誰でも指示できる。
  enabled: true

orders:
  # 「視点の先を守れ」で狙える最大の距離（ブロック）
  hold-max-distance: 48

combat:
  # 敵に気づく距離（ブロック）
  engage-radius: 16
  # 積極的に戦うとき、持ち場からどこまで敵を追うか
  push-leash: 24
  # 持ち場優先のとき、持ち場からどこまで敵を追うか
  guard-leash: 8
  # 追従のとき、相手にどこまで近づくか
  follow-distance: 4
  # 守る地点に着いたとみなす距離
  arrive-radius: 3
  # 倒されてから復活するまでの秒数。復活する場所は陣営のリスポーン地点（/sb spawnpoint）、
  # 未設定なら持ち主の横
  respawn-seconds: 10
  # 経路を探す最大の距離（ブロック）。持ち場がこれより離れていると歩いていけません
  path-range: 96
  # 移動の速さの倍率。平らな地面で測った値: 1.0 で毎秒約 3.9 ブロック（歩きより少し遅い）、
  # 1.95 で毎秒約 7.2 ブロック（プレイヤーのダッシュジャンプ、毎秒約 7.1 ブロックと同じくらい）
  speed: 1.95
  # 狙いを選び直す間隔（秒）。この間隔ごとに最も近い敵を探し、今の相手より 2 ブロック以上近い敵がいれば狙いを替える。
  # 今の相手が倒れた・見えなくなった・範囲を出たときは、間隔を待たずにすぐ選び直す。
  retarget-seconds: 2
  attack-range: 3.0
  # 攻撃の間隔（tick。20 で 1 秒）
  attack-delay-ticks: 12
  # 経路探索の方式: CITIZENS / CITIZENS_ASYNC / MINECRAFT
  pathfinder: "CITIZENS"

# ボットの装備（アイテムの ID）。不要な部位は行ごと消してください
equipment:
  hand: IRON_SWORD
  helmet: IRON_HELMET
  chestplate: IRON_CHESTPLATE
  leggings: IRON_LEGGINGS
  boots: IRON_BOOTS
