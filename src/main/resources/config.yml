# SiegeBot の設定。変更したら /siegebot reload で読み直せます。
# リスポーン地点と /sb spawn で出したボットは、ゲーム内コマンドで設定し、data.yml に保存されます。

# 攻め・守りに対応するスコアボードのチーム名（/team で作ったチームの名前）
teams:
  attack: "Attack"
  defend: "Defence"

# ボットは自動では出ない（倒れても自動では戻らない）。コマンドブロックの /sb revive <@p|@a|プレイヤー|bots|all> で参戦させる。
# 出す場所は陣営のリスポーン地点（/sb spawnpoint）、未設定なら持ち主の横。持ち主が倒れるとボットも倒れる。
personal-bots:
  # true: チームに入っているプレイヤーに、専用のボット（「名前の兵」）を出す。1 人が複数体持てる。
  #       抜けると消える。指示（指揮メニュー・/sbc）は自分のボットにだけ効く。
  #       /sb spawn で出したボットは持ち主がいないので、誰の指示も受けず、出した地点を守る。
  # false: 専用のボットは出さず、チームのボットにチームの誰でも指示できる。
  enabled: true
  # 1 人が持てるボットの上限（1〜9）。何体出すかはコマンドブロックの /sb revive <対象> <数> で決める
  max-per-player: 5

orders:
  # 「視点の先を守れ」で狙える最大の距離（ブロック）
  hold-max-distance: 48
  # 「呼び寄せる」（自分の所へ瞬間移動）を続けて使えない秒数。0 なら何度でも使える
  call-cooldown-seconds: 0
  # true: CombatLog プラグインで戦闘中（プレイヤーを殴った・殴られた後の combat-time 秒）のあいだは「呼び寄せる」を使えない。
  #       CombatLog が入っていなければ何もしない
  call-blocked-in-combat: true
  # 「退却」で戻る途中、この秒数たっても持ち場・持ち主に着かなければ退却をやめる（詰まったまま戦わなくなるのを防ぐ）
  retreat-timeout-seconds: 20

# ボットの頭の上の名前
name-tag:
  # team: 同じ陣営（チーム）のプレイヤーにだけ見える。all: 全員に見える（Citizens の名前の表示のまま）
  visible-to: team

combat:
  # 敵に気づく距離（ブロック）
  engage-radius: 16
  # 積極的に戦うとき、持ち場からどこまで敵を追うか
  push-leash: 24
  # 持ち場優先のとき、持ち場からどこまで敵を追うか
  guard-leash: 8
  # 追従のとき、相手にどこまで近づくか
  follow-distance: 4
  # 守る地点に着いたとみなす距離
  arrive-radius: 3
  # 経路を探す最大の距離（ブロック）。持ち場がこれより離れていると歩いていけません
  path-range: 96
  # 飛び降りてよい高さ（ブロック）。既定の 384 はワールドの高さ全部なので、どれだけ高い所からでも飛び降りる
  max-fall-distance: 384
  # false にするとボットは落下のダメージを受けない（true ならプレイヤーと同じく、高すぎると落ちて倒れる）
  fall-damage: true
  # 自動の回復: regen-interval-seconds 秒ごとに regen-amount ずつ体力が戻る（体力は最大 20 = ハート 10 個）。
  # 既定は 2 秒ごとに 1（ハート半分）で、空の体力から満タンまで約 40 秒。regen-amount: 0 で回復しない
  regen-amount: 1.0
  regen-interval-seconds: 2
  # ダメージ（攻撃・落下・炎など）を受けてから、この秒数は回復しない。0 なら受けている最中も回復する
  regen-delay-seconds: 10
  # 移動の速さの倍率。平らな地面で測った値: 1.0 で毎秒約 3.9 ブロック（歩きより少し遅い）、
  # 1.5 で毎秒約 5.6 ブロック（プレイヤーのダッシュと同じくらい）、
  # 1.95 で毎秒約 7.2 ブロック（プレイヤーのダッシュジャンプと同じくらい）
  # （上の値は経路探索が CITIZENS のときのもの。MINECRAFT では 1.5 で毎秒約 5.4 ブロック）
  speed: 1.5
  # 火力: ボットが与えるダメージの倍率（1.0 でそのまま）
  damage-multiplier: 1.2
  # 防御力: ボットが受けるダメージをこの値で割る（1.0 でそのまま。1.2 なら受けるダメージが約 83%）
  # ボットどうしの戦いでは両方が効くので、火力と防御力が同じ値なら、ダメージは 1.0 のときと同じになる
  defense-multiplier: 1.2
  # 狙いを選び直す間隔（秒）。この間隔ごとに最も近い敵を探し、今の相手より 2 ブロック以上近い敵がいれば狙いを替える。
  # 今の相手が倒れた・見えなくなった・範囲を出たときは、間隔を待たずにすぐ選び直す。
  retarget-seconds: 2
  attack-range: 3.0
  # 攻撃の間隔（tick。20 で 1 秒）
  attack-delay-ticks: 12
  # 経路探索の方式: MINECRAFT / CITIZENS / CITIZENS_ASYNC
  # MINECRAFT 以外では、高い所から飛び降りる経路を見つけられない（試験サーバーで確かめた結果）
  pathfinder: "MINECRAFT"

# 盾（左手）。プレイヤーと同じく、弓・クロスボウで狙われたときと矢が飛んでくるときに構え、
# 近接で殴っている最中（狙う敵が攻撃の届く距離 + 1 ブロック以内）は構えない。構えている間は遅く歩く
shield:
  enabled: true
  # 狙っている敵・飛んでくる矢に気づく距離（ブロック）
  detect-radius: 24
  # 構えている間の移動の速さ（speed に掛ける倍率）
  move-speed-multiplier: 0.3
  # 脅威がなくなってから盾を下ろすまでの秒数
  lower-after-seconds: 0.5
  # 構えてから防げるようになるまでの tick（20 で 1 秒）。プレイヤーは 5 だが、ボットは気づいてから構えるので
  # 5 だと速い矢（弓を引き切った矢）に間に合わず、盾を上げているのに当たってノックバックする。既定 0 で構えた瞬間から防ぐ
  blocking-delay-ticks: 0

# 兵種。/sb revive <対象> [数] [soldier|spearman|archer] と /sb spawn <名前> <陣営> [soldier|spearman|archer] で選ぶ
units:
  # 兵種を書かなかったときに新しく出す兵種
  default: soldier
  # 剣兵: 敵に近づいて斬る。盾で矢を防ぐ（shield の節）
  soldier:
    # 専用のボットの名前の後ろに付ける文字（「名前の兵」）
    name-suffix: "の兵"
    # 装備。部位は hand・off_hand・helmet・chestplate・leggings・boots。不要な部位は行ごと消す。
    # アイテムは ID（IRON_SWORD）か、/give と同じ部品つきの書き方（'minecraft:iron_axe[custom_model_data={strings:["1"]}]'）
    equipment:
      hand: IRON_SWORD
      off_hand: SHIELD
      helmet: IRON_HELMET
      chestplate: IRON_CHESTPLATE
      leggings: IRON_LEGGINGS
      boots: IRON_BOOTS
  # 槍兵: 届く距離が長く（attack-range）、届くぎりぎりの所から突く。盾は持たない
  spearman:
    name-suffix: "の槍兵"
    equipment:
      # 本サーバーのリソースパックで槍の見た目になる鉄の斧（custom_model_data の文字 "1"）
      hand: 'minecraft:iron_axe[custom_model_data={strings:["1"]}]'
      helmet: IRON_HELMET
      chestplate: IRON_CHESTPLATE
      leggings: CHAINMAIL_LEGGINGS
      boots: IRON_BOOTS
    # 攻撃の届く距離（ブロック。目から相手の当たり判定までの距離。プレイヤーの素手・剣は 3.0）
    attack-range: 4.5
    # 攻撃の間隔（tick）。鉄の斧は 22 tick（1.1 秒）より短いと、プレイヤーと同じく力が溜まらず弱くなる
    attack-delay-ticks: 22
    # 近づくときは、届く距離よりこれだけ内側に入った所で止まる（ブロック。0.2 なら 4.3 で止まる。止まるまでに少し滑るので、0 にはしない）
    stop-inside: 0.2
    # 敵が届く距離よりこれだけ内側まで寄ってきたら（1.5 なら 3.0 より近い）、届くぎりぎりまで下がる
    back-off-inside: 1.5
  # 弓兵: 離れた所から矢を撃つ。矢は尽きず、拾えない
  archer:
    name-suffix: "の弓兵"
    equipment:
      hand: BOW
      helmet: CHAINMAIL_HELMET
      chestplate: LEATHER_CHESTPLATE
      leggings: LEATHER_LEGGINGS
      boots: LEATHER_BOOTS
    # 撃つ最大の距離（ブロック）。これより遠い・見えない敵へは近づく（近づくのは持ち場から push-leash / guard-leash の内だけ。
    # 狙うのは持ち場からこの距離までの敵）
    range: 16
    # 敵がこの距離より近いと下がる（ブロック）
    min-distance: 5
    # 下がるときは、敵からこの距離まで離れる（ブロック）
    keep-distance: 10
    # 弓を引き絞る時間（tick。20 で 1 秒。プレイヤーの弓は 20 で引き切り）
    draw-ticks: 20
    # 撃ってから次に引き始めるまでの時間（tick）
    shot-interval-ticks: 10
    # 矢の速さ（ブロック/tick。プレイヤーが弓を引き切ると 3.0）
    arrow-speed: 3.0
    # 矢の基本ダメージ。当たったときのダメージは「速さ × これ」（3.0 × 3.0 で 9 = ハート 4.5 個。引き切りの会心で少し増える）。
    # 既定の 3.0 はプレイヤーの弓（2.0）の 1.5 倍
    # combat.damage-multiplier も掛かる
    arrow-damage: 3.0
    # 狙いのぶれ（プレイヤーの弓は 1.0。0 で狙ったとおりに飛ぶ）
    inaccuracy: 1.0
