# SiegeBot の設定。変更したら /siegebot reload で読み直せます。
# 場所・門・ボットの一覧はゲーム内コマンドで設定し、data.yml に保存されます。

# 攻め・守りに対応するスコアボードのチーム名（/team で作ったチームの名前）
teams:
  attack: "attack"
  defend: "defend"

llm:
  # Anthropic の API キー。空なら環境変数 ANTHROPIC_API_KEY を使います。
  # どちらも無いと LLM は使われず、指示はキーワードだけで判定します（chat.parser が llm のときは理解しません）。
  api-key: ""
  model: "claude-haiku-5-5"
  timeout-seconds: 20

chat:
  # 通常のチャットを聞く（同じチームのプレイヤーの発言だけに反応します）
  listen-public-chat: true
  # /teammsg と /tm（チームチャット）を聞く
  listen-teammsg: true
  # 空でなければ、この文字で始まる発言だけを指示として扱います（例: "!"）
  prefix: ""
  # 指示の理解のしかた
  #   auto    : まずキーワードで判定し、読み取れなかった発言だけを LLM に回す（API キーがなければキーワードだけ）
  #   keyword : キーワードだけで判定する（無料・即答。LLM は使わない）
  #   llm     : すべて LLM に回す（API キーが必要）
  parser: "auto"

personal-bots:
  # true: チームに入っているプレイヤー 1 人に 1 体、専用のボット（「名前の兵」）を出す。
  #       参加すると出て、抜けると消える。指示（指揮メニュー・/sbc・チャット）は自分のボットにだけ効く。
  #       /sb spawn で出したボットは持ち主がいないので、誰の指示も受けず初期指示で動く。
  # false: 専用のボットは出さず、チームのボット全員にチームの誰でも指示できる。
  enabled: true

# 味方のプレイヤーがいないときの指示（自由な文章）。空なら前線で戦います。
default-orders:
  attack: "前線で戦え"
  defend: "前線を守れ"

combat:
  # 敵に気づく距離（ブロック）
  engage-radius: 16
  # 積極的に戦うとき、持ち場からどこまで敵を追うか
  push-leash: 24
  # 持ち場優先のとき、持ち場からどこまで敵を追うか
  guard-leash: 8
  # 追従のとき、相手にどこまで近づくか
  follow-distance: 4
  # 持ち場に着いたとみなす距離
  arrive-radius: 3
  # 倒されてから復活するまでの秒数
  respawn-seconds: 10
  # 経路を探す最大の距離（ブロック）。前線どうしがこれより離れていると歩いていけません
  path-range: 96
  # 移動の速さの倍率。平らな地面で測った値: 1.0 で毎秒約 3.9 ブロック（歩きより少し遅い）、
  # 1.95 で毎秒約 7.2 ブロック（プレイヤーのダッシュジャンプ、毎秒約 7.1 ブロックと同じくらい）
  speed: 1.95
  # 狙いを選び直す間隔（秒）。この間隔ごとに最も近い敵を探し、今の相手より 2 ブロック以上近い敵がいれば狙いを替える。
  # 今の相手が倒れた・見えなくなった・範囲を出たときは、間隔を待たずにすぐ選び直す。
  retarget-seconds: 2
  attack-range: 3.0
  # 攻撃の間隔（tick。20 で 1 秒）
  attack-delay-ticks: 12
  # 経路探索の方式: CITIZENS / CITIZENS_ASYNC / MINECRAFT
  pathfinder: "CITIZENS"

gates:
  # 門を調べる間隔（tick）
  check-period-ticks: 20
  # 門の範囲のうち、この割合以上が空気になったら「開いた」とみなす
  open-air-ratio: 0.9
  # 侵攻度が変わったとき、ボットがチームに知らせる
  announce: true

# ボットの装備（アイテムの ID）。不要な部位は行ごと消してください
equipment:
  hand: IRON_SWORD
  helmet: IRON_HELMET
  chestplate: IRON_CHESTPLATE
  leggings: IRON_LEGGINGS
  boots: IRON_BOOTS
