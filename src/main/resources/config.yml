# SiegeBot の設定。変更したら /siegebot reload で読み直せます。
# リスポーン地点は、ゲーム内コマンドで設定し、data.yml に保存されます。

# 攻め・守りに対応するスコアボードのチーム名（/team で作ったチームの名前）
teams:
  attack: "Attack"
  defend: "Defence"

# ボットは自動では出ない。倒れたボットはすぐ消える（蘇生しない）。コマンドブロックの /sb revive <@p|@a|プレイヤー|all> か、
# /sb picks で決めた回数の兵科選択で、新しく出して参戦させる。
# 出す場所は陣営のリスポーン地点（/sb spawnpoint）、未設定なら持ち主の横。持ち主が倒れるとボットも倒れる。
personal-bots:
  # チームに入っているプレイヤーは、専用のボット（「名前の兵」）を持てる。指示は自分のボットにだけ効く。
  # 1 人が持てるボットの上限（1〜30）。何体出すかはコマンドブロックの /sb revive <対象> <数> で決める
  max-per-player: 5

# 試験用: true にすると、持ち主のいないボット（/sb spawn で出し、出した地点を守る。data.yml に保存され起動時に出る）を使える。
# 本サーバーでは false のまま（書かなければ false）
test-bots:
  enabled: false

orders:
  # 「視点の先を守れ」で狙える最大の距離（ブロック）
  hold-max-distance: 48
  # 「呼び寄せる」（自分の所へ瞬間移動）を続けて使えない秒数。0 なら何度でも使える
  call-cooldown-seconds: 0
  # true: CombatLog プラグインで戦闘中（プレイヤーを殴った・殴られた後の combat-time 秒）のあいだは「呼び寄せる」を使えない。
  #       CombatLog が入っていなければ何もしない
  call-blocked-in-combat: true
  # 「退却」で戻る途中、この秒数たっても持ち場・持ち主に着かなければ退却をやめる（詰まったまま戦わなくなるのを防ぐ）
  retreat-timeout-seconds: 20

# ボットの頭の上の名前
name-tag:
  # team: 同じ陣営（チーム）のプレイヤーにだけ見える。all: 全員に見える
  visible-to: team

combat:
  # 敵に気づく距離（ブロック）
  engage-radius: 16
  # 積極的に戦うとき、持ち場からどこまで敵を追うか
  push-leash: 24
  # 持ち場優先のとき、持ち場からどこまで敵を追うか
  guard-leash: 8
  # 追従のとき、相手にどこまで近づくか
  follow-distance: 4
  # 守る地点に着いたとみなす距離
  arrive-radius: 3
  # 経路を探す最大の距離（ブロック）。持ち場がこれより離れていると歩いていけません
  path-range: 96
  # 飛び降りてよい高さ（ブロック）。既定の 384 はワールドの高さ全部なので、どれだけ高い所からでも飛び降りる
  max-fall-distance: 384
  # false にするとボットは落下のダメージを受けない（true ならプレイヤーと同じく、高すぎると落ちて倒れる）
  fall-damage: true
  # 自動の回復: regen-interval-seconds 秒ごとに regen-amount ずつ体力が戻る（体力は最大 20 = ハート 10 個）。
  # 既定は 2 秒ごとに 1（ハート半分）で、空の体力から満タンまで約 40 秒。regen-amount: 0 で回復しない
  regen-amount: 1.0
  regen-interval-seconds: 2
  # ダメージ（攻撃・落下・炎など）を受けてから、この秒数は回復しない。0 なら受けている最中も回復する
  regen-delay-seconds: 10
  # 移動の速さの倍率。平らな地面で測った値: 1.0 で毎秒約 3.9 ブロック（歩きより少し遅い）、
  # 1.5 で毎秒約 5.6 ブロック（プレイヤーのダッシュと同じくらい）、
  # 1.95 で毎秒約 7.2 ブロック（プレイヤーのダッシュジャンプと同じくらい）
  # （上の値は経路探索が CITIZENS のときのもの。MINECRAFT では 1.5 で毎秒約 5.4 ブロック）
  speed: 1.5
  # 火力: ボットが与えるダメージの倍率（1.0 でそのまま）
  damage-multiplier: 1.2
  # 防御力: ボットが受けるダメージをこの値で割る（1.0 でそのまま。1.2 なら受けるダメージが約 83%）
  # ボットどうしの戦いでは両方が効くので、火力と防御力が同じ値なら、ダメージは 1.0 のときと同じになる
  defense-multiplier: 1.2
  # 狙いを選び直す間隔（秒）。この間隔ごとに最も近い敵を探し、今の相手より 2 ブロック以上近い敵がいれば狙いを替える。
  # 今の相手が倒れた・見えなくなった・範囲を出たときは、間隔を待たずにすぐ選び直す。
  retarget-seconds: 2
  attack-range: 3.0
  # 攻撃の間隔（tick。20 で 1 秒）
  attack-delay-ticks: 12
  # 経路探索の方式: MINECRAFT / CITIZENS / CITIZENS_ASYNC
  # MINECRAFT 以外では、高い所から飛び降りる経路を見つけられない（試験サーバーで確かめた結果）
  pathfinder: "MINECRAFT"

# ボットどうしが重ならないようにする（毎 tick、近すぎるボットを水平に押し分ける。人間のプレイヤーは対象外）
separation:
  enabled: true
  # 押し分ける最小の水平距離（ブロック。0.6〜1.5。既定 0.9）
  # 同じ陣営のボットが 1 マスの通路で逆向きに歩いてすれ違うときだけは、プレイヤーどうしの接触と同じく弱い押しだけですれ違える
  min-distance: 0.9

# 盾（左手）。プレイヤーと同じく、弓・クロスボウで狙われたときと矢が飛んでくるときに構え、
# 近接で殴っている最中（狙う敵が攻撃の届く距離 + 1 ブロック以内）は構えない。構えている間は遅く歩く
shield:
  enabled: true
  # 狙っている敵・飛んでくる矢に気づく距離（ブロック）
  detect-radius: 24
  # 構えている間の移動の速さ（speed に掛ける倍率）
  move-speed-multiplier: 0.3
  # 脅威がなくなってから盾を下ろすまでの秒数
  lower-after-seconds: 0.5
  # 構えてから防げるようになるまでの tick（20 で 1 秒）。プレイヤーは 5 だが、ボットは気づいてから構えるので
  # 5 だと速い矢（弓を引き切った矢）に間に合わず、盾を上げているのに当たってノックバックする。既定 0 で構えた瞬間から防ぐ
  blocking-delay-ticks: 0

# 兵種。/sb revive <対象> [数] [soldier|spearman|archer] で選ぶ
units:
  # 兵種を書かなかったときに新しく出す兵種
  default: soldier
  # 剣兵: 敵に近づいて斬る。盾で矢を防ぐ（shield の節）
  soldier:
    # 専用のボットの名前の後ろに付ける文字（「名前の兵」）
    name-suffix: "の兵"
    # 書くと、この兵種だけ combat の値の代わりに使う（書かなければ combat の値。体力は 20 = ハート 10 個）
    # speed: 1.5
    # damage-multiplier: 1.2
    # defense-multiplier: 1.2
    # max-health: 20
    # attack-range: 3.0         … 攻撃の届く距離（書かなければ combat.attack-range）
    # attack-delay-ticks: 12    … 攻撃の間隔（書かなければ combat.attack-delay-ticks）
    # 装備。部位は hand・off_hand・helmet・chestplate・leggings・boots。不要な部位は行ごと消す。
    # アイテムは ID（IRON_SWORD）か、/give と同じ部品つきの書き方（'minecraft:iron_axe[custom_model_data={strings:["1"]}]'）
    equipment:
      hand: IRON_SWORD
      off_hand: SHIELD
      helmet: IRON_HELMET
      chestplate: IRON_CHESTPLATE
      leggings: IRON_LEGGINGS
      boots: IRON_BOOTS
    # エイム（照準）。turn-speed: 照準が回る速さの上限（度/tick。20 tick で 1 秒。0 で一瞬で向く）。
    # sway: 照準の揺れの大きさ（度。0 で揺れない）。攻撃のたびに、揺れを含めた照準が相手の当たり判定に
    # 入っていれば当たり、外れていれば空振り（素早く横に回り込まれると、照準が追いつくまで空振りする）
    aim:
      turn-speed: 15
      sway: 5.5
      # 照準を大きく回すほど揺れが大きくなる: 1 tick に 1 度回すごとに、その tick の揺れにこれだけ足す（度。0 で回しても増えない）。
      # 揺れは数 tick で元に戻るので、大きく振り向いた直後ほど外れやすい（15 度振り向くと 5.5 + 15 × 0.8 = 17.5 度）
      turn-sway: 0.8
      # 反応の遅れ（tick。20 で 1 秒、0 で遅れなし）。この tick 前の相手の位置を見て照準を回す。盾を構えている間は遅らせない
      reaction-ticks: 2
  # 槍兵: 届く距離が長く（attack-range）、届くぎりぎりの所から突く。殴り合いの最中も、飛んでくる矢は盾で防ぐ（突くより優先）
  spearman:
    name-suffix: "の槍兵"
    # 書くと、この兵種だけ combat の値の代わりに使う（書かなければ combat の値。体力は 20 = ハート 10 個）
    # speed: 1.5
    # damage-multiplier: 1.2
    # defense-multiplier: 1.2
    # max-health: 20
    equipment:
      # 本サーバーのリソースパックで槍の見た目になる鉄の斧（custom_model_data の文字 "1"）
      hand: 'minecraft:iron_axe[custom_model_data={strings:["1"]}]'
      off_hand: SHIELD
      helmet: IRON_HELMET
      chestplate: IRON_CHESTPLATE
      leggings: CHAINMAIL_LEGGINGS
      boots: IRON_BOOTS
    # 攻撃の届く距離（ブロック。目から相手の当たり判定までの距離。プレイヤーの素手・剣は 3.0）
    attack-range: 4.5
    # 攻撃の間隔（tick）。鉄の斧は 22 tick（1.1 秒）より短いと、プレイヤーと同じく力が溜まらず弱くなる
    attack-delay-ticks: 22
    # 近づくときは、届く距離よりこれだけ内側に入った所で止まる（ブロック。0.2 なら 4.3 で止まる。止まるまでに少し滑るので、0 にはしない）
    stop-inside: 0.2
    # 敵が届く距離よりこれだけ内側まで寄ってきたら（1.5 なら 3.0 より近い）、届くぎりぎりまで下がる
    back-off-inside: 1.5
    # 矢などの脅威がなくなってから盾を下ろすまでの秒数（0 ですぐ下ろす。剣兵は shield.lower-after-seconds）
    shield-lower-after-seconds: 0
    # true: 敵を追う道に蜘蛛の巣があれば追わない（2 秒後に見直す。届く敵は、巣の向こうでもその場で突く）
    avoid-cobweb: true
    # エイム（照準）。turn-speed: 照準が回る速さの上限（度/tick。20 tick で 1 秒。0 で一瞬で向く）。
    # sway: 照準の揺れの大きさ（度。0 で揺れない）。剣兵と同じく、照準が相手から外れていれば空振り
    aim:
      turn-speed: 12
      sway: 3.8
      # 照準を大きく回すほど揺れが大きくなる: 1 tick に 1 度回すごとに、その tick の揺れにこれだけ足す（度。0 で回しても増えない）。
      # 揺れは数 tick で元に戻るので、大きく振り向いた直後ほど外れやすい（12 度振り向くと 3.8 + 12 × 0.7 = 12.2 度）
      turn-sway: 0.7
      # 反応の遅れ（tick。20 で 1 秒、0 で遅れなし）。この tick 前の相手の位置を見て照準を回す。盾を構えている間は遅らせない
      reaction-ticks: 2
    # 盾の耐久（防げる量。0 で盾のアイテムのまま = 336）。槍兵の盾は既定で半分
    shield-durability: 168
  # 弓兵: 離れた所から矢を撃つ。矢は尽きず、拾えない
  archer:
    name-suffix: "の弓兵"
    # 書くと、この兵種だけ combat の値の代わりに使う（書かなければ combat の値。体力は 20 = ハート 10 個）
    # speed: 1.5
    # damage-multiplier: 1.2
    # defense-multiplier: 1.2
    # max-health: 20
    equipment:
      hand: BOW
      helmet: CHAINMAIL_HELMET
      chestplate: LEATHER_CHESTPLATE
      leggings: LEATHER_LEGGINGS
      boots: LEATHER_BOOTS
    # 撃つ最大の距離（ブロック）。見えてこの距離以内の敵は、構え（積極的・持ち場優先）や持ち場からの距離に関係なく撃つ。
    # 見えない・遠い敵へは近づくが、近づくのは持ち場から push-leash / guard-leash の内だけ
    range: 32
    # 敵がこの距離より近いと下がる（ブロック。積極的のときだけ。持ち場優先では下がらず、その場で撃ち続ける）
    min-distance: 5
    # 下がるときは、敵からこの距離まで離れる（ブロック）
    keep-distance: 10
    # 弓を引き絞る時間（tick。20 で 1 秒。プレイヤーの弓は 20 で引き切り）
    draw-ticks: 20
    # 撃ってから次に引き始めるまでの時間（tick）
    shot-interval-ticks: 10
    # 矢の速さ（ブロック/tick。プレイヤーが弓を引き切ると 3.0）
    arrow-speed: 3.0
    # 矢の基本ダメージ。当たったときのダメージは「速さ × これ」（3.0 × 3.0 で 9 = ハート 4.5 個。引き切りの会心で少し増える）。
    # 既定の 3.0 はプレイヤーの弓（2.0）の 1.5 倍。火力（units.archer.damage-multiplier、書かなければ combat の値）も掛かる
    arrow-damage: 3.0
    # 狙いのぶれ（プレイヤーの弓は 1.0。0 で狙ったとおりに飛ぶ）
    inaccuracy: 1.0
    # エイム（照準）。turn-speed: 照準が回る速さの上限（度/tick。20 tick で 1 秒。0 で一瞬で向く）。
    # sway: 照準の揺れの大きさ（度。0 で揺れない）。照準が狙いに来るまで撃たず、撃つ向きは揺れを含めた照準
    # （1 度で 30 ブロック先が約 0.5 ブロックずれる。その上に inaccuracy のぶれも掛かる）
    aim:
      turn-speed: 9
      sway: 1.8
      # 照準を大きく回すほど揺れが大きくなる: 1 tick に 1 度回すごとに、その tick の揺れにこれだけ足す（度。0 で回しても増えない）。
      # 揺れは数 tick で元に戻るので、大きく振り向いた直後ほど外れやすい（9 度回すと 1.8 + 9 × 1.0 = 10.8 度）
      turn-sway: 1.0
      # 反応の遅れ（tick。20 で 1 秒、0 で遅れなし）。この tick 前の弾道の向きを見て照準を回す。
      # 弓兵は 2 tick ごとに弾道を更新するので、発射時の実効の遅れは 2〜4 tick になる
      reaction-ticks: 2
      # 動いている相手を先読みする割合（1.0 で矢が飛ぶ時間分を正確に先読み、0.0 で先読みしない。0.0〜1.5）
      lead-factor: 0.7

# マップ別・陣営別の設定（0.17.0 から）。この config.yml の項目はそのまま使われ、足りない部分だけ次の書き方で上書きできます。
#   plugins/SiegeBot/maps/<マップ名>.yml に、変えたい項目だけを書く（/sb map <マップ名> で切り替え、/sb map default で戻す）。
#   マップのファイルの一番上に「extends: 親のマップ名」と書くと、その親の設定を引き継ぐ。
#   sides.attack / sides.defend の下に書いた項目は、攻め・守りの片方だけに効く（この config.yml にも、マップのファイルにも書ける）。
#   例（maps/castle_a.yml）:
#     combat:
#       speed: 1.2
#     sides:
#       defend:
#         units:
#           soldier:
#             equipment:
#               helmet: DIAMOND_HELMET
# 詳しくは README の「マップ別・陣営別の設定」を見てください。
